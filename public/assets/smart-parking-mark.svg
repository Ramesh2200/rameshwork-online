<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="shieldBgMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B33" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
    <filter id="neonGlowMark" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Smart Shield -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#shieldBgMark)" stroke="url(#brandGrad)" stroke-width="2.2" />

  <!-- Parking Bay Boundary Lines -->
  <path d="M12 36V12H23C27.4 12 31 15.5 31 20C31 24.5 27.4 28 23 28H18" stroke="url(#brandGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M18 20H23C24.1 20 25 20.9 25 22C25 23.1 24.1 24 23 24H18V20Z" fill="url(#brandGrad)" />

  <!-- Smart IoT Pulse Signals -->
  <path d="M33 11C35.5 13 37 16 37 19.5" stroke="#00F2FE" stroke-width="2.2" stroke-linecap="round" filter="url(#neonGlowMark)" />
  <path d="M38 7C41.5 9.5 43.5 14 43.5 19.5" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0.9" />

  <!-- Sensor Dot -->
  <circle cx="37" cy="35" r="3.5" fill="#00F2FE" filter="url(#neonGlowMark)" />
  <circle cx="37" cy="35" r="1.5" fill="#FFFFFF" />
</svg>
