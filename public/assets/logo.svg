<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Inter:wght@600;700&amp;display=swap');
      .logo-title { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 23px; letter-spacing: 0.5px; }
      .logo-sub { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; font-size: 8px; letter-spacing: 2.5px; }
    </style>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#4FACFE" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#05DF72" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1B33" />
      <stop offset="100%" stop-color="#070D1A" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="neonHalo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-Tech Shield Emblem -->
  <g transform="translate(3, 4)">
    <rect x="0" y="0" width="42" height="42" rx="12" fill="url(#shieldBg)" stroke="url(#cyberGrad)" stroke-width="2.2" />
    
    <!-- Stylized Geometric P with Road/Car Silhouette -->
    <path d="M12 32V10H22C26.4 10 29.5 13.2 29.5 17.5C29.5 21.8 26.4 25 22 25H17.5" stroke="url(#cyberGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Smart Sensor Beam -->
    <path d="M31 10.5C33.5 12.5 35 15.5 35 18" stroke="#00F2FE" stroke-width="2.2" stroke-linecap="round" filter="url(#neonHalo)" />
    <path d="M35.5 7C39 9.8 40.5 14 40.5 18" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
    
    <!-- Glowing IoT Telemetry Node -->
    <circle cx="34" cy="32" r="3.2" fill="#00F2FE" filter="url(#neonHalo)" />
    <circle cx="34" cy="32" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography with Neon Accents -->
  <text x="56" y="31" class="logo-title" fill="#FFFFFF">
    SMART<tspan fill="url(#cyberGrad)">PARK</tspan>
  </text>
  <text x="57" y="43" class="logo-sub" fill="#38BDF8">
    AUTONOMOUS MOBILITY
  </text>
  <circle cx="232" cy="27" r="3" fill="#10B981" filter="url(#neonHalo)" />
</svg>
